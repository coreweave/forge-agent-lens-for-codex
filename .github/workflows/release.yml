name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.11.21
          enable-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$package_version"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Run release checks
        run: |
          npm run build
          npm run typecheck
          npx prettier --check .
          npm test
          npm audit
          uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint
      - name: Build package tarball
        id: package
        run: |
          tarball="$(npm pack --silent)"
          echo "$tarball" > release-tarball.txt
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.6.1'
      - name: Smoke test packed package on minimum Node
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)"
          npm install --global --prefix "$prefix" "./$TARBALL"
          test -x "$prefix/bin/forge-agent-lens-for-codex"
          "$prefix/bin/forge-agent-lens-for-codex" --help
          FORGE_CODEX_HOME="$prefix/state" \
            CODEX_HOME="$prefix/codex" \
            FORGE_TRACE_PROJECT="entity/project" \
            WANDB_API_KEY="test" \
            "$prefix/bin/forge-agent-lens-for-codex" status --json \
            | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { const x = JSON.parse(s); if (!x.ready || !x.apiKeyResolved) process.exit(1); });'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tarball="$(cat release-tarball.txt)"
          gh release create "$RELEASE_TAG" "$tarball" \
            --generate-notes \
            --title "forge-agent-lens-for-codex $RELEASE_TAG" \
            --verify-tag
